<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>KYC Exception Agent</title>
  <style>
    :root{--ink:#12211a;--muted:#617069;--paper:#f4f2ea;--card:#fffef9;--green:#165f46;--lime:#c8ff62;--line:#d9ddd5;--red:#b83b32;--amber:#a06a00}
    *{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font-family:Inter,ui-sans-serif,system-ui,-apple-system,sans-serif}
    header{padding:30px 5vw 24px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:end;background:#173c2f;color:white}
    header h1{font-size:clamp(28px,4vw,52px);line-height:.95;margin:0;letter-spacing:-.04em;max-width:720px}header p{margin:0;color:#c8d6cf;max-width:380px;text-align:right}
    main{max-width:1400px;margin:auto;padding:28px 5vw 60px}.control{display:grid;grid-template-columns:1fr auto auto auto;gap:14px;margin-bottom:24px}
    select,button{font:inherit;border:1px solid var(--line);border-radius:8px;padding:13px 16px;background:var(--card)}button{cursor:pointer;background:var(--lime);border-color:#8ab63a;font-weight:750}button:disabled{opacity:.5;cursor:not-allowed}
    .grid{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(300px,.65fr);gap:22px}.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:22px;box-shadow:0 5px 18px #24372d0a}
    h2{margin:0 0 16px;font-size:20px}h3{font-size:13px;text-transform:uppercase;letter-spacing:.09em;color:var(--muted);margin:22px 0 10px}.result{font-size:27px;font-weight:800;letter-spacing:-.03em}.summary{font-size:18px;line-height:1.5}
    .badges{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0 20px}.badge{font-size:12px;padding:5px 9px;border-radius:99px;background:#edf2ed;border:1px solid var(--line)}.critical{color:var(--red);background:#fff0ed}.high{color:var(--red)}.medium{color:var(--amber)}.low{color:var(--green)}
    .timeline{list-style:none;padding:0;margin:0}.timeline li{position:relative;padding:0 0 18px 25px;border-left:2px solid #cae0d4;margin-left:6px}.timeline li:last-child{border-left-color:transparent}.timeline li:before{content:'';position:absolute;left:-6px;top:2px;width:10px;height:10px;background:var(--green);border-radius:50%}.timeline b{display:block}.timeline span,.muted{color:var(--muted);font-size:13px;line-height:1.5}
    .policy{border-left:3px solid var(--green);padding:2px 0 2px 12px;margin:13px 0}.policy b{font-size:13px}.policy p{font-size:14px;margin:4px 0;color:#45554d;line-height:1.45}.facts li{margin:8px 0}
    .approval{margin-top:20px;padding:18px;border-radius:9px;background:#eff7e5;border:1px solid #c8df9f}.approval button{width:100%;margin-top:10px}.empty{text-align:center;padding:80px 30px;color:var(--muted)}
    .override{margin:14px 0;padding:14px 16px;border-radius:9px;background:#fff0ed;border:1px solid #f0b8ad;color:#7a2a20;font-size:14px;line-height:1.5}
    .rationale{margin:12px 0;padding:14px 16px;border-radius:9px;background:#f2f4ef;border:1px solid var(--line);font-size:14px;line-height:1.5}
    .rationale-meta{font-size:12px;color:var(--muted);margin-top:8px}
    details{border-top:1px solid var(--line);padding:12px 0}summary{cursor:pointer;font-weight:650}.toolout{font:12px ui-monospace,SFMono-Regular,monospace;white-space:pre-wrap;background:#f2f4ef;padding:10px;border-radius:6px;margin-top:8px;overflow:auto}
    .ontology{display:flex;align-items:center;flex-wrap:wrap;gap:6px}.node{background:#e4eee8;border:1px solid #bfd1c6;border-radius:5px;padding:7px 9px;font-size:12px}.arrow{color:#7c8b83}
    @media(max-width:850px){header{display:block}header p{text-align:left;margin-top:12px}.grid{grid-template-columns:1fr}.control{grid-template-columns:1fr}}
  </style>
</head>
<body>
<header><h1 id="hTitle">KYC Exception<br>Resolution Agent</h1><p id="hSubtitle">Ontology-grounded reasoning, policy evidence, bounded tools, and human-controlled actions.</p></header>
<main>
  <div class="control">
    <select id="case"></select>
    <select id="planner">
      <option value="auto">Planner: auto (OpenRouter or heuristic)</option>
      <option value="heuristic">Planner: heuristic (offline, no LLM)</option>
      <option value="openrouter">Planner: OpenRouter (real LLM)</option>
      <option value="adversarial">Planner: adversarial (simulated compromised model)</option>
    </select>
    <select id="lang"><option value="en">English</option><option value="vi">Tiếng Việt</option></select>
    <button id="run">Run agent</button>
  </div>
  <div id="content" class="empty card">Select a synthetic case and run the agent.</div>
</main>
<script>
const $=s=>document.querySelector(s), esc=s=>String(s??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));

// Static UI chrome mirrors app/i18n.py's UI_STRINGS. Kept small and manual
// on purpose (a demo, not a translation pipeline); everything derived from
// case content is instead rendered server-side per request with `lang`.
const CHROME = {
  en: {title:'KYC Exception<br>Resolution Agent', subtitle:'Ontology-grounded reasoning, policy evidence, bounded tools, and human-controlled actions.', run:'Run agent', reasoning:'Reasoning…', empty:'Select a synthetic case and run the agent.'},
  vi: {title:'Tác Tử Xử Lý<br>Ngoại Lệ KYC', subtitle:'Suy luận dựa trên ontology, bằng chứng chính sách, công cụ có giới hạn, và hành động do con người kiểm soát.', run:'Chạy tác tử', reasoning:'Đang suy luận…', empty:'Chọn một hồ sơ mẫu và chạy tác tử.'},
};
function applyChrome(){
  const t = CHROME[$('#lang').value] || CHROME.en;
  $('#hTitle').innerHTML = t.title; $('#hSubtitle').textContent = t.subtitle; $('#run').textContent = t.run;
  if ($('#content').classList.contains('empty')) $('#content').textContent = t.empty;
}

async function init(){const cases=await fetch('/api/cases').then(r=>r.json());$('#case').innerHTML=cases.map(c=>`<option value="${esc(c.case_id)}">${esc(c.case_id)} — ${esc(c.title)} · ${esc(c.signal)}</option>`).join('')}

let lastDecision = null;
function render(d){
 lastDecision = d;
 const documents = d.approval?.documents_label;
 const docLine = documents ? `<div class="muted">${d.lang==='vi'?'Hồ sơ được yêu cầu bổ sung':'Requested documents'}: ${esc(documents)}</div>` : '';
 const approval=d.approval&&!d.executed_action?`<div class="approval"><b>${d.lang==='vi'?'Cần con người phê duyệt':'Human approval required'}</b><div class="muted">${esc(d.approval.action)} · key ${esc(d.approval.approval_key)}</div>${docLine}<button onclick="approve('${esc(d.approval.approval_key)}')">${d.lang==='vi'?'Phê duyệt hành động có giới hạn':'Approve bounded action'}</button></div>`:'';
 const executed=d.executed_action?`<div class="approval"><b>${d.lang==='vi'?'Đã thực thi hành động':'Action executed'}</b><div>${esc(d.executed_action.action)} · ${esc(d.executed_action.ticket_id)}${d.executed_action.replayed?(d.lang==='vi'?' · phát lại idempotent':' · idempotent replay'):''}</div></div>`:'';
 const override=d.guardrail_override?`<div class="override"><b>${d.lang==='vi'?'Lớp bảo vệ đã ghi đè':'Guardrail override'}</b><br>${esc(d.guardrail_override)}</div>`:'';
 const confLabel = d.lang==='vi' ? 'độ tin cậy của bộ lập luận' : 'planner confidence';
 const overriddenNote = d.guardrail_override ? (d.lang==='vi' ? ' (đã bị ghi đè)' : ' (overridden)') : '';
 const translationNote = !d.rationale_translated ? `<div class="rationale-meta">${d.lang==='vi'?'Không thể dịch trực tiếp (thiếu OPENROUTER_API_KEY) -- hiển thị nguyên văn tiếng Anh của mô hình.':"Live translation unavailable (no OPENROUTER_API_KEY) -- showing the model's original English answer."}</div>` : '';
 $('#content').className='grid'; $('#content').innerHTML=`
 <section class="card"><div class="result">${esc(d.outcome_label)}</div><div class="badges"><span class="badge ${d.risk_level.toLowerCase()}">${esc(d.risk_label)}</span><span class="badge">${esc(d.model)}</span><span class="badge">${d.tool_calls.length} tool calls</span></div><p class="summary">${esc(d.summary)}</p>${override}
 <h3>${d.lang==='vi'?'Lý giải của bộ lập luận (chỉ tham khảo)':'Planner rationale (advisory)'}</h3><div class="rationale">${esc(d.llm_rationale)}<div class="rationale-meta">${confLabel}: ${Math.round(d.proposal_confidence*100)}%${overriddenNote}</div>${translationNote}</div>
 <h3>${d.lang==='vi'?'Đường dẫn ontology':'Ontology path'}</h3><div class="ontology">${d.ontology_path.map((n,i)=>`${i?'<span class="arrow">→</span>':''}<span class="node">${esc(n)}</span>`).join('')}</div>
 <h3>${d.lang==='vi'?'Dữ kiện đã xác minh':'Grounded facts'}</h3><ul class="facts">${d.facts.map(x=>`<li>${esc(x)}</li>`).join('')}</ul>
 <h3>${d.lang==='vi'?'Bằng chứng chính sách':'Policy evidence'}</h3>${d.citations.map(c=>`<div class="policy"><b>${esc(c.policy_id)} · v${esc(c.version)} · ${esc(c.section)}</b><p>${esc(c.excerpt)}</p></div>`).join('')}${approval}${executed}</section>
 <aside><section class="card"><h2>${d.lang==='vi'?'Nhật ký suy luận':'Agent trace'}</h2><ol class="timeline">${d.trace.map(e=>`<li><b>${e.status==='override'?'🚨 ':e.status==='degraded'?'⚠️ ':''}${esc(e.title)}</b><span>${esc(e.detail)}</span></li>`).join('')}</ol><h3>${d.lang==='vi'?'Chi tiết công cụ':'Tool inspection'}</h3>${d.tool_calls.map(t=>`<details><summary>${esc(t.name)} · ${t.duration_ms} ms</summary><div class="toolout">${esc(JSON.stringify(t.output,null,2))}</div></details>`).join('')}</section></aside>`;
}

async function run(){
 $('#run').disabled=true; const restore=$('#run').textContent; $('#run').textContent=(CHROME[$('#lang').value]||CHROME.en).reasoning;
 try{
  const r=await fetch('/api/run',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({case_id:$('#case').value,planner:$('#planner').value,lang:$('#lang').value})});
  render(await r.json());
 } finally { $('#run').disabled=false; $('#run').textContent=restore; }
}
async function approve(key){const r=await fetch('/api/approve',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({approval_key:key,lang:$('#lang').value})});render(await r.json())}

async function onLangChange(){
 if (lastDecision){
  const r=await fetch('/api/relocalize',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({decision_id:lastDecision.decision_id,lang:$('#lang').value})});
  render(await r.json());
 }
 applyChrome();
}
$('#run').addEventListener('click',run);
$('#lang').addEventListener('change',onLangChange);
applyChrome(); init();
</script>
</body></html>
