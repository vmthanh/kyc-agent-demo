<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>KYC Exception Agent</title>
<style>body{margin:0;background:#f4f2ea;color:#12211a;font-family:system-ui,sans-serif}header{padding:30px 5vw;background:#173c2f;color:#fff}main{max-width:1400px;margin:auto;padding:28px 5vw}.control{display:grid;grid-template-columns:1fr auto auto auto auto;gap:14px;margin-bottom:24px}select,input,button{font:inherit;border:1px solid #d9ddd5;border-radius:8px;padding:13px 16px;background:#fffef9}button{cursor:pointer;background:#c8ff62;font-weight:750}.grid{display:grid;grid-template-columns:1.35fr .65fr;gap:22px}.card{background:#fffef9;border:1px solid #d9ddd5;border-radius:12px;padding:22px}.empty{text-align:center;padding:80px 30px;color:#617069}.badges,.ontology,.workflow-graph{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0 20px}.badge,.node,.workflow-node{font-size:12px;padding:6px 9px;border-radius:6px;background:#edf2ed;border:1px solid #d9ddd5}.workflow-node.complete{color:#165f46}.workflow-node.active{color:#fff;background:#165f46}.muted{color:#617069;font-size:13px}.approval,.override,.rationale{margin:14px 0;padding:16px;border-radius:9px;background:#eff7e5;border:1px solid #c8df9f}.override{background:#fff0ed;border-color:#f0b8ad}.approval button,.approval input{display:block;width:100%;margin-top:10px}.phases{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:12px 0 20px}.phase{background:#f7f8f4;border:1px solid #d9ddd5;border-radius:8px;padding:8px}.phase-h{font-size:11px;font-weight:800;letter-spacing:.08em;color:#617069;margin-bottom:6px}.phase .workflow-node{display:block;margin:4px 0}.gov{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:14px 0}.gov div{border:1px solid #d9ddd5;border-radius:9px;padding:10px;background:#f7f8f4}.gov b{display:block;font-size:11px;letter-spacing:.08em;color:#165f46}.gov .arrow{color:#617069}.rule-card{margin:14px 0;padding:14px 16px;border-radius:9px;border:1px solid #b9d3c6;background:#f0f7f3}.badge.expert{background:#fff4d6;border-color:#f0d68a}.badge.gov-count{background:#fffef9}.tag{font-size:10px;font-weight:800;color:#617069;margin-right:6px}.path{font-family:ui-monospace,monospace;font-size:12px;margin-top:8px}.compare{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}.cmp{border-radius:9px;padding:12px 14px;border:1px solid #d9ddd5;background:#f7f8f4;font-size:14px}.cmp.bad{background:#fff0ed;border-color:#f0b8ad}.cmp.ok{background:#eff7e5;border-color:#c8df9f}.cmp h4{margin:0 0 6px}.cmp-verdict{margin:0 0 14px;padding:10px 14px;border-radius:9px;font-weight:650}.cmp-verdict.bad{background:#ffdcd4;color:#7a1d0c}.cmp-verdict.ok{background:#e3f1d4;color:#1d4a12}button.secondary{background:#fffef9}[hidden]{display:none!important}.tabs{display:flex;gap:8px;margin-bottom:16px}.tab{background:#fffef9;font-weight:650}.tab.on{background:#173c2f;color:#fff}.rf-grid{display:grid;grid-template-columns:1fr 1fr;gap:18px}.rf table{border-collapse:collapse;width:100%;font-size:13px}.rf td,.rf th{border-bottom:1px solid #e3e6df;padding:6px 8px;text-align:left;vertical-align:top}.rf .st{font-size:12px;font-weight:800;padding:3px 8px;border-radius:6px}.st.proposed{background:#fff4d6}.st.blocked,.st.invalid,.st.rejected{background:#ffdcd4}.st.promoted{background:#d9f0c8}.rf .row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:8px}.rf .row input,.rf .row select{padding:8px 10px}.rf .row button{padding:8px 12px}.rf .amd{border:1px solid #d9ddd5;border-radius:10px;padding:14px;margin:12px 0}.hint{margin:12px 0;padding:10px 14px;border-radius:9px;background:#fff4d6;border:1px solid #f0d68a}@media(max-width:850px){.grid,.control{grid-template-columns:1fr}}</style></head>
<body><header><h1 id="hTitle">KYC Exception<br>Resolution Agent</h1><p id="hSubtitle">Ontology-grounded reasoning, policy evidence, bounded tools, and human-controlled actions.</p></header><main><div class="tabs"><button id="tabAgent" class="tab on">Agent</button><button id="tabReflect" class="tab">Reflect &amp; Assurance</button></div><div id="reflect" class="rf" hidden></div><div class="control"><select id="case"></select><select id="planner"><option value="normal">Planner: normal (OpenRouter)</option><option value="compromised_demo">Planner: compromised demo</option></select><select id="lang"><option value="en">English</option><option value="vi">Tiếng Việt</option></select><button id="run">Run agent</button><button id="compare" class="secondary">Compare with generic RAG</button></div><div id="content" class="empty card">Select a synthetic case and run the agent.</div></main>
<!-- Compatibility source contracts: ${caseLabel} ${esc(d.case_id)} /api/reject Action rejected workflow-node active $('#case').addEventListener('change', clearDecision); if (version !== viewVersion) return; -->
<script>
const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));
const PHASES={SEE:['intake','load_customer','verify_documents','screen_watchlists','load_risk','evidence_gate'],THINK:['retrieve_policy','policy_precheck','openrouter_reason','reconcile_guard'],ACT:['action_review','execute_action','await_documents','validate_submission','increment_cycle','operational_review'],REFLECT:['finalize']};const NODES=Object.values(PHASES).flat();let lastDecision=null,viewVersion=0;
const UI={en:{title:'KYC Exception<br>Resolution Agent',subtitle:'Ontology-grounded reasoning, policy evidence, bounded tools, and human-controlled actions.',run:'Run agent',empty:'Select a synthetic case and run the agent.',failed:'Request failed',approval:'Human approval required',approve:'Approve bounded action',reject:'Reject action',reason:'Rejection reason (required)',docs:'Document submission required',submit:'Submit verified evidence',ops:'Operational review required',ack:'Acknowledge manual handoff',trace:'Agent trace',graph:'Workflow graph',facts:'Grounded facts',policy:'Policy evidence',tools:'Tool inspection',rationale:'Planner rationale (advisory)',status:'Workflow status',replay:'Action replay',branch:'Branch trace'},vi:{title:'Tác Tử Xử Lý<br>Ngoại Lệ KYC',subtitle:'Suy luận dựa trên ontology, bằng chứng chính sách, công cụ có giới hạn, và hành động do con người kiểm soát.',run:'Chạy tác tử',empty:'Chọn một hồ sơ mẫu và chạy tác tử.',failed:'Yêu cầu thất bại',approval:'Cần con người phê duyệt',approve:'Phê duyệt hành động có giới hạn',reject:'Từ chối hành động',reason:'Lý do từ chối (bắt buộc)',docs:'Cần bổ sung tài liệu',submit:'Gửi bằng chứng đã xác minh',ops:'Cần chuyển rà soát vận hành',ack:'Xác nhận chuyển xử lý thủ công',trace:'Nhật ký suy luận',graph:'Đồ thị quy trình',facts:'Dữ kiện đã xác minh',policy:'Bằng chứng chính sách',tools:'Chi tiết công cụ',rationale:'Lý giải của bộ lập luận',status:'Trạng thái quy trình',replay:'Phát lại hành động',branch:'Dấu vết nhánh'}};
Object.assign(UI.en,{requested:'Requested documents',normal:'Planner: normal (OpenRouter)',compromised:'Planner: compromised demo',warning:'Compromised demo mode is active; deterministic policy remains authoritative.',override:'Guardrail override',executed:'Action executed',noReplay:'No replay',replayed:'Idempotent replay',reasonLabel:'Reason',confidence:'planner confidence',cycle:'cycle',attempts:'attempts',tokens:'tokens',cost:'cost',attempt:'attempt',status:'Workflow status',unavailable:'OpenRouter unavailable',notAvailable:'n/a',compareBtn:'Compare with generic RAG',baselineTitle:'Generic LLM + RAG (no ontology, no guard)',governedTitle:'Ontology-governed agent',wouldExecute:'would execute immediately',noApproval:'0 human approvals',approvalGate:'human approval gate',unsafeVerdict:'Generic agent would have executed {w} with no approval, violating {r} ({p}).',divergeVerdict:'Generic agent diverges from {r} ({p}).',agreeVerdict:'Both reach the same outcome; only the governed agent binds it to a versioned rule and a human approval.',baselineError:'Baseline model unavailable',citedLabel:'cited',signalHint:'Reviewer signal captured. Open Reflect & Assurance to draft, replay, and approve a rule amendment.',sampleStats:'Generic agent sampled {n}×: diverged {d}×, unsafe write {u}×. Governed agent: rule-bound, same outcome every time.',phaseSEE:'See',phaseTHINK:'Think',phaseACT:'Act',phaseREFLECT:'Reflect',propose:'Propose',verify:'Verify',commit:'Commit',govTitle:'Governed write: Propose → Verify → Commit',agreed:'model agreed',overridden:'model overridden',awaiting:'awaiting human approval',noWrite:'no write',ruleLabel:'Decided by rule',expertRule:'expert-captured rule',policyRule:'policy rule',sourceLabel:'Source',ontologyPath:'Ontology path',govReads:'Gov. reads',govWrites:'Gov. writes',govApprovals:'approvals',govOverrides:'overrides'});Object.assign(UI.vi,{requested:'Hồ sơ được yêu cầu bổ sung',normal:'Bộ lập luận: bình thường (OpenRouter)',compromised:'Bộ lập luận: mô phỏng bị xâm nhập',warning:'Đang bật chế độ mô phỏng bị xâm nhập; chính sách xác định vẫn là nguồn có thẩm quyền.',override:'Lớp bảo vệ đã ghi đè',executed:'Đã thực thi hành động',noReplay:'Không phát lại',replayed:'Phát lại idempotent',reasonLabel:'Lý do',confidence:'độ tin cậy của bộ lập luận',cycle:'vòng',attempts:'lần thử',tokens:'token',cost:'chi phí',attempt:'lần thử',status:'Trạng thái quy trình',unavailable:'Không thể truy cập OpenRouter',notAvailable:'không có',compareBtn:'So sánh với RAG thông thường',baselineTitle:'LLM + RAG thông thường (không ontology, không kiểm soát)',governedTitle:'Tác tử có ontology kiểm soát',wouldExecute:'sẽ thực thi ngay',noApproval:'0 lượt phê duyệt',approvalGate:'cổng phê duyệt của con người',unsafeVerdict:'Tác tử thông thường sẽ thực thi {w} mà không cần phê duyệt, vi phạm {r} ({p}).',divergeVerdict:'Tác tử thông thường lệch khỏi {r} ({p}).',agreeVerdict:'Hai bên cùng kết quả; chỉ tác tử có kiểm soát gắn kết quả với quy tắc có phiên bản và phê duyệt của con người.',baselineError:'Mô hình đối chứng không khả dụng',citedLabel:'trích dẫn',signalHint:'Đã ghi nhận phản hồi của người rà soát. Mở tab Đúc kết & Đảm bảo để soạn, chạy lại và phê duyệt sửa đổi quy tắc.',sampleStats:'Chạy tác tử thông thường {n} lần: lệch {d} lần, ghi không an toàn {u} lần. Tác tử có kiểm soát: bám quy tắc, kết quả nhất quán.',phaseSEE:'Quan sát',phaseTHINK:'Suy luận',phaseACT:'Hành động',phaseREFLECT:'Đúc kết',propose:'Đề xuất',verify:'Kiểm chứng',commit:'Thực thi',govTitle:'Ghi có kiểm soát: Đề xuất → Kiểm chứng → Thực thi',agreed:'mô hình đồng thuận',overridden:'mô hình bị ghi đè',awaiting:'chờ con người phê duyệt',noWrite:'không ghi',ruleLabel:'Quyết định bởi quy tắc',expertRule:'quy tắc từ chuyên gia',policyRule:'quy tắc chính sách',sourceLabel:'Nguồn',ontologyPath:'Đường dẫn ontology',govReads:'Lượt đọc',govWrites:'Lượt ghi',govApprovals:'phê duyệt',govOverrides:'ghi đè'});
function text(k){return (UI[$('#lang').value]||UI.en)[k]||UI.en[k]}function applyChrome(){const u=UI[$('#lang').value]||UI.en;$('#hTitle').innerHTML=u.title;$('#hSubtitle').textContent=u.subtitle;$('#run').textContent=u.run;$('#compare').textContent=u.compareBtn||UI.en.compareBtn;$('#planner').options[0].text=u.normal;$('#planner').options[1].text=u.compromised;if($('#content').classList.contains('empty'))$('#content').textContent=u.empty}function jsonFetch(url,options){return fetch(url,options).then(async r=>{const body=await r.json();if(!r.ok)throw Error(body.error||`Request failed (${r.status})`);return body})}function errorCard(msg){$('#content').className='card';$('#content').innerHTML=`<div class="override"><b>${esc(text('failed'))}</b><br>${esc(msg)}</div>`}function clearDecision(){viewVersion++;lastDecision=null;$('#content').className='empty card';$('#content').textContent=text('empty');}
function taskControls(d){const t=d.pending_task,p=t?.payload||{};if(!t)return '';if(t.kind==='action_approval')return `<div class="approval"><b>${text('approval')}</b><div class="muted">${esc(p.action_payload?.action||d.approval?.action)} · ${esc(t.interrupt_key)}</div><pre>${esc(JSON.stringify(p.action_payload||{},null,2))}</pre><button onclick="approve('${esc(t.interrupt_key)}')">${text('approve')}</button><input id="reject-reason" placeholder="${text('reason')}"><button onclick="reject('${esc(t.interrupt_key)}')">${text('reject')}</button></div>`;if(t.kind==='document_submission')return `<div class="approval"><b>${text('docs')}</b><div class="muted">${text('requested')}: ${esc((p.requested_documents||[]).join(', '))}</div><button onclick="submitEvidence('${esc(t.interrupt_key)}',${esc(JSON.stringify(p.requested_documents||[]))})">${text('submit')}</button></div>`;return `<div class="approval"><b>${text('ops')}</b><div class="muted">${text('reasonLabel')}: ${esc(p.operational_reason||d.summary)}</div><button onclick="acknowledge('${esc(t.interrupt_key)}')">${text('ack')}</button></div>`}
function govStrip(d,conf){const r=d.rule,verify=r?`${esc(r.id)}@${esc(r.version)} · ${esc(text(d.guardrail_override?'overridden':'agreed'))}`:esc(text('notAvailable')),commit=d.executed_action?esc(d.executed_action.ticket_id):d.pending_task?.kind==='action_approval'?esc(text('awaiting')):esc(text('noWrite'));return `<div class="muted">${esc(text('govTitle'))}</div><div class="gov"><div><b>1 · ${esc(text('propose'))}</b>${esc(d.model||text('unavailable'))} · ${esc(conf)}</div><div><b>2 · ${esc(text('verify'))}</b>${verify}</div><div><b>3 · ${esc(text('commit'))}</b>${commit}</div></div>`}function ruleCard(d){const r=d.rule;if(!r)return '';const kind=(r.source||{}).kind,expert=kind==='expert';return `<div class="rule-card"><b>${esc(text('ruleLabel'))}: ${esc(r.id)}@${esc(r.version)}</b> <span class="badge ${expert?'expert':''}">${esc(text(expert?'expertRule':'policyRule'))}</span> <span class="badge">${esc(r.cites||'')}</span><div class="muted">${esc(r.description||'')}</div><div class="muted">${esc(text('sourceLabel'))}: ${esc((r.source||{}).ref||'')}</div><div class="path">${esc(text('ontologyPath'))}: ${(d.ontology_path||[]).map(esc).join(' → ')}</div></div>`}function govBadges(d){const g=d.governance||{};return `<span class="badge gov-count">${esc(text('govReads'))} ${esc(g.reads||0)}</span><span class="badge gov-count">${esc(text('govWrites'))} ${esc(g.writes||0)}</span><span class="badge gov-count">${esc(g.approvals||0)} ${esc(text('govApprovals'))}</span><span class="badge gov-count">${esc(g.overrides||0)} ${esc(text('govOverrides'))}</span>`}
function render(d){lastDecision=d;const trace=d.trace||[],active=new Set(trace.map(e=>e.step));if(d.current_node)active.add(d.current_node);const node=n=>`<span class="workflow-node ${n===d.current_node?'active':active.has(n)?'complete':''}">${esc(n)}</span>`,graph=`<div class="phases">${Object.entries(PHASES).map(([p,ns])=>`<div class="phase"><div class="phase-h">${esc(text('phase'+p))}</div>${ns.map(node).join('')}</div>`).join('')}</div>`,conf=d.proposal_confidence != null && Number.isFinite(Number(d.proposal_confidence))?Math.round(Number(d.proposal_confidence)*100)+'%':text('unavailable'),warning=d.planner_mode==='compromised_demo'?`<div class="override"><b>${esc(text('compromised'))}</b><br>${esc(text('warning'))}</div>`:'';const override=d.guardrail_override?`<div class="override"><b>${esc(text('override'))}</b><br>${esc(d.guardrail_override)}</div>`:'';const facts=(d.facts||[]).map(x=>`<li>${esc(x)}</li>`).join(''),citations=(d.citations||[]).map(c=>`<div><b>${esc(c.policy_id)} · v${esc(c.version)} · ${esc(c.section)}</b><p>${esc(c.excerpt)}</p></div>`).join(''),tools=(d.tool_calls||[]).map(t=>`<details><summary>${esc(t.name)} · ${esc(t.duration_ms)} ms</summary><pre>${esc(JSON.stringify(t.output,null,2))}</pre></details>`).join(''),rejection=d.review_result?.status==='rejected'?`<div class="override">${esc(text('reject'))}: ${esc(d.review_result.reason)}</div><div class="hint">${esc(text('signalHint'))}</div>`:'',executed=d.executed_action?`<div class="approval">${esc(text('executed'))}: ${esc(d.executed_action.ticket_id)}${d.executed_action.replayed?' · '+esc(text('replayed')):''}</div>`:'';$('#content').className='grid';$('#content').innerHTML=`<section class="card"><div><b>${esc(d.outcome_label)}</b></div><div class="badges"><span class="badge">${esc(text('status'))}: ${esc(d.workflow_status||'UNKNOWN')}</span><span class="badge">${esc(d.risk_label||'UNKNOWN')}</span><span class="badge">${esc(d.model||text('unavailable'))}</span></div>${warning}${override}${govStrip(d,conf)}${ruleCard(d)}<p>${esc(d.summary)}</p><div class="rationale"><b>${text('rationale')}</b><br>${esc(d.llm_rationale||text('unavailable'))}<div class="muted">${text('confidence')}: ${conf}</div></div>${taskControls(d)}${rejection}${executed}<h3>${text('facts')}</h3><ul>${facts}</ul><h3>${text('policy')}</h3>${citations}<h3>${text('tools')}</h3>${tools}</section><aside class="card"><h2>${text('graph')}</h2>${graph}<div class="badges">${govBadges(d)}</div><h2>${text('trace')}</h2><div class="badges"><span class="badge">${text('cycle')} ${esc(d.cycle_count||1)}/${esc(d.max_cycles||1)}</span><span class="badge">${text('attempts')} ${esc(d.planner_attempts||0)}</span><span class="badge">${esc(d.planner_usage?.total_tokens||0)} ${text('tokens')}</span><span class="badge">${text('cost')} ${esc(d.planner_usage?.cost??text('notAvailable'))}</span><span class="badge">${d.executed_action?.replayed?esc(text('replayed')):esc(text('noReplay'))}</span></div><ol>${trace.map(e=>`<li><span class="tag">${esc(e.phase||'')}${e.gov_stage?' · '+esc(e.gov_stage):''}</span><b>${esc(e.title)}</b> <span class="muted">${esc(e.detail)} · ${text('attempt')} ${esc(e.attempt||1)}</span></li>`).join('')}</ol><h3>${text('branch')}</h3><div class="muted">${trace.map(e=>esc(e.route||e.step)).join(' → ')}</div></aside>`}
async function resumeTask(interruptKey,response){const version=++viewVersion,caseId=lastDecision?.case_id,lang=$('#lang').value;try{const d=await jsonFetch('/api/resume',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({interrupt_key:interruptKey,response,lang})});if(version===viewVersion&&caseId===$('#case').value&&lang===$('#lang').value)render(d)}catch(e){if(version===viewVersion)errorCard(e.message)}}function approve(k){resumeTask(k,{approved:true})}function reject(k){const reason=$('#reject-reason').value.trim();if(reason)resumeTask(k,{approved:false,reason})}function submitEvidence(k,docs){resumeTask(k,{documents:docs.map(type=>({type,status:'verified'}))})}function acknowledge(k){resumeTask(k,{acknowledged:true})}
async function run(){const version=++viewVersion,caseId=$('#case').value,lang=$('#lang').value;try{const d=await jsonFetch('/api/run',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({case_id:caseId,planner_mode:$('#planner').value,lang})});if(version===viewVersion&&caseId===$('#case').value&&lang===$('#lang').value)render(d)}catch(e){if(version===viewVersion)errorCard(e.message)}}function fill(t,m){return t.replace(/\{(\w)\}/g,(_,k)=>m[k]??'')}function comparePanel(c){const b=c.baseline,g=c.governed,x=c.comparison,r=x.violated_rule||'',p=x.violated_policy||'';const stats=x.samples>1?`<div class="muted">${esc(fill(text('sampleStats'),{n:x.samples,d:x.divergent_samples,u:x.unsafe_samples}))} · ${esc(Object.entries(x.sample_outcomes||{}).map(([k,v])=>k+' ×'+v).join(', '))}</div>`:'';const verdict=x.unsafe?`<div class="cmp-verdict bad">⚠ ${esc(fill(text('unsafeVerdict'),{w:x.unapproved_write,r,p}))}</div>`:!x.agree?`<div class="cmp-verdict bad">${esc(fill(text('divergeVerdict'),{r,p}))}</div>`:`<div class="cmp-verdict ok">${esc(text('agreeVerdict'))}</div>`;const base=b.error?`<b>${esc(text('baselineError'))}</b>: ${esc(b.error)}`:`<b>${esc(b.outcome)}</b>${b.would_execute?` · ${esc(b.would_execute)} ${esc(text('wouldExecute'))}`:''}<div class="muted">${esc(text('noApproval'))} · ${esc(text('citedLabel'))}: ${esc((b.citations||[]).join(', '))}</div><p class="muted">${esc(b.rationale||'')}</p>`;const gr=g.rule?`${esc(g.rule.id)}@${esc(g.rule.version)} · ${esc(g.rule.cites||'')}`:'';return `${verdict}${stats}<div class="compare"><div class="cmp ${x.agree?'':'bad'}"><h4>${esc(text('baselineTitle'))}</h4>${base}</div><div class="cmp ok"><h4>${esc(text('governedTitle'))}</h4><b>${esc(g.outcome)}</b> · ${gr}<div class="muted">${esc(text('approvalGate'))} · ${esc(g.model||'')}</div></div></div>`}async function compareRun(){const version=++viewVersion,caseId=$('#case').value,lang=$('#lang').value;$('#content').className='card';$('#content').textContent='…';try{const c=await jsonFetch('/api/compare',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({case_id:caseId,planner_mode:$('#planner').value,lang,samples:10})});if(version===viewVersion&&caseId===$('#case').value&&lang===$('#lang').value){render(c.governed);$('#content section.card').insertAdjacentHTML('afterbegin',comparePanel(c))}}catch(e){if(version===viewVersion)errorCard(e.message)}}async function init(){try{const cs=await jsonFetch('/api/cases');$('#case').innerHTML=cs.map(c=>`<option value="${esc(c.case_id)}">${esc(c.case_id)} — ${esc(c.title)}</option>`).join('')}catch(e){errorCard(e.message)}}async function onLangChange(){const version=++viewVersion,decision=lastDecision,caseId=$('#case').value,lang=$('#lang').value;applyChrome();if(!decision)return;try{const d=await jsonFetch('/api/relocalize',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({decision_id:decision.decision_id,lang})});if(version===viewVersion&&caseId===$('#case').value&&lang===$('#lang').value)render(d)}catch(e){if(version===viewVersion)errorCard(e.message)}}$('#run').addEventListener('click',run);$('#compare').addEventListener('click',compareRun);$('#case').addEventListener('change',clearDecision);$('#lang').addEventListener('change',onLangChange);init();
// Localized confidence/cost fallback: text('confidence'), text('notAvailable').
applyChrome();</script>
<script>
/* Reflect & Assurance: reviewer signal -> candidate rule -> replay -> gated promotion. */
const RF = {
  en: {ontology: 'Active ontology', shipped: 'shipped', promoted: 'promoted', reset: 'Reset to shipped ontology',
       signals: 'Reviewer signals', noSignals: 'No signals yet. Reject an action in the Agent tab to create one.',
       draftRules: 'Draft (rule narrowing)', draftLlm: 'Draft (LLM)', unsafe: 'Try an unsafe amendment: raise R-AML-01 threshold to 0.95',
       amendments: 'Amendments', noAmendments: 'No amendments yet.', diff: 'Change', impact: 'Replay impact',
       replayed: 'cases replayed', tightened: 'tightened', loosened: 'loosened', regressions: 'safety regressions',
       agreement: 'label agreement', changedCases: 'Changed decisions', approver: 'Approver', approve: 'Approve', reject: 'Reject',
       gate: 'Promotion needs an approver with a KYC Lead or Compliance role and zero safety regressions.',
       rule: 'Rule', prio: 'Priority', stop: 'Hard stop', source: 'Source', params: 'Params'},
  vi: {ontology: 'Ontology đang hoạt động', shipped: 'bản gốc', promoted: 'đã nâng cấp', reset: 'Khôi phục ontology gốc',
       signals: 'Phản hồi của người rà soát', noSignals: 'Chưa có phản hồi. Hãy từ chối một hành động ở tab Tác tử.',
       draftRules: 'Soạn (thu hẹp quy tắc)', draftLlm: 'Soạn (LLM)', unsafe: 'Thử sửa đổi không an toàn: nâng ngưỡng R-AML-01 lên 0.95',
       amendments: 'Đề xuất sửa đổi', noAmendments: 'Chưa có đề xuất.', diff: 'Thay đổi', impact: 'Tác động khi chạy lại',
       replayed: 'hồ sơ chạy lại', tightened: 'chặt hơn', loosened: 'lỏng hơn', regressions: 'hồi quy an toàn',
       agreement: 'khớp nhãn', changedCases: 'Quyết định thay đổi', approver: 'Người duyệt', approve: 'Phê duyệt', reject: 'Từ chối',
       gate: 'Cần người duyệt vai trò KYC Lead hoặc Tuân thủ và không có hồi quy an toàn.',
       rule: 'Quy tắc', prio: 'Ưu tiên', stop: 'Dừng cứng', source: 'Nguồn', params: 'Tham số'}
};
const rt = k => (RF[$('#lang').value] || RF.en)[k] || RF.en[k];
const post = (url, body) => jsonFetch(url, {method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify(body || {})});
const pct = v => v == null ? '–' : Math.round(v * 100) + '%';

function showTab(which) {
  const reflect = which === 'reflect';
  $('#tabAgent').classList.toggle('on', !reflect);
  $('#tabReflect').classList.toggle('on', reflect);
  $('#reflect').hidden = !reflect;
  document.querySelector('.control').hidden = reflect;
  $('#content').hidden = reflect;
  if (reflect) loadReflect();
}

async function loadReflect() {
  try {
    const [onto, signals, amendments] = await Promise.all([
      jsonFetch('/api/ontology'), jsonFetch('/api/reflect/signals'), jsonFetch('/api/amendments')]);
    renderReflect(onto, signals, amendments);
  } catch (e) { $('#reflect').innerHTML = `<div class="card override">${esc(e.message)}</div>`; }
}

function renderReflect(onto, signals, amendments) {
  const rules = onto.rules.map(r => `<tr><td><b>${esc(r.id)}@${esc(r.version)}</b><div class="muted">${esc(r.cites)}</div></td>
    <td>${esc(r.priority)}</td><td>${r.hard_stop ? '●' : ''}</td><td>${esc((r.source || {}).kind || '')}</td>
    <td><code>${esc(JSON.stringify(r.params))}</code></td></tr>`).join('');
  const sigs = signals.length ? signals.map(s => `<div class="amd"><b>${esc(s.id)}</b> · ${esc(s.case_id)} · ${esc(s.kind)} ·
    ${esc(s.rule_id || '–')}@${esc(s.rule_version || '')}<div class="muted">“${esc(s.reviewer_reason)}”</div>
    <div class="row"><button onclick="draft('${esc(s.id)}','rules')">${esc(rt('draftRules'))}</button>
    <button class="secondary" onclick="draft('${esc(s.id)}','llm')">${esc(rt('draftLlm'))}</button></div></div>`).join('')
    : `<p class="muted">${esc(rt('noSignals'))}</p>`;
  const amds = amendments.length ? amendments.slice().reverse().map(renderAmendment).join('') : `<p class="muted">${esc(rt('noAmendments'))}</p>`;
  $('#reflect').innerHTML = `<div class="rf-grid">
    <section class="card"><h2>${esc(rt('ontology'))} v${esc(onto.version)}
      <span class="badge">${esc(onto.promoted ? rt('promoted') : rt('shipped'))}</span></h2>
      <div class="muted">${esc(onto.active_path)}</div>
      <table><tr><th>${esc(rt('rule'))}</th><th>${esc(rt('prio'))}</th><th>${esc(rt('stop'))}</th><th>${esc(rt('source'))}</th><th>${esc(rt('params'))}</th></tr>${rules}</table>
      <div class="row"><button class="secondary" onclick="resetOntology()">${esc(rt('reset'))}</button></div>
      <h2>${esc(rt('signals'))}</h2>${sigs}
      <div class="row"><button class="secondary" onclick="unsafeAmendment()">${esc(rt('unsafe'))}</button></div></section>
    <section class="card"><h2>${esc(rt('amendments'))}</h2><div class="muted">${esc(rt('gate'))}</div>${amds}</section></div>`;
}

function renderAmendment(a) {
  const diff = (a.diff || []).map(d => `<tr><td><code>${esc(d.path)}</code></td><td>${esc(JSON.stringify(d.before))}</td><td>→ <b>${esc(JSON.stringify(d.after))}</b></td></tr>`).join('');
  const i = a.impact;
  const impact = i ? `<div class="badges"><span class="badge">${esc(i.cases_replayed)} ${esc(rt('replayed'))}</span>
      <span class="badge">${esc(i.tightened)} ${esc(rt('tightened'))}</span><span class="badge">${esc(i.loosened)} ${esc(rt('loosened'))}</span>
      <span class="badge ${i.safety_regressions.length ? 'expert' : ''}">${esc(i.safety_regressions.length)} ${esc(rt('regressions'))}</span>
      <span class="badge">${esc(rt('agreement'))} ${pct(i.agreement_before)} → ${pct(i.agreement_after)}</span></div>
      <div class="muted">${esc(rt('changedCases'))}:</div><table>${i.changed.slice(0, 8).map(c => `<tr><td>${esc(c.case_id)}</td><td>${esc(c.before)}</td><td>→ ${esc(c.after)}</td></tr>`).join('')}</table>
      ${i.changed.length > 8 ? `<div class="muted">+${i.changed.length - 8} more</div>` : ''}` : '';
  const approvals = (a.approvals || []).map(x => `<div class="muted">${x.approved ? '✓' : '✗'} ${esc(x.approver)} (${esc(x.role)})</div>`).join('');
  const controls = a.status === 'proposed' ? `<div class="row"><input id="ap-${esc(a.id)}" placeholder="${esc(rt('approver'))}" value="lan.pham">
      <select id="role-${esc(a.id)}"><option value="kyc_lead">KYC Lead</option><option value="compliance">Compliance</option><option value="analyst">Analyst</option></select>
      <button onclick="reviewAmendment('${esc(a.id)}',true)">${esc(rt('approve'))}</button>
      <button class="secondary" onclick="reviewAmendment('${esc(a.id)}',false)">${esc(rt('reject'))}</button></div>` : '';
  const errors = (a.errors || []).map(e => `<div class="override">${esc(e)}</div>`).join('');
  return `<div class="amd"><b>${esc(a.id)}</b> · ${esc(a.rule_id)} ${esc(a.base_version || '')} → ${esc((a.candidate || {}).version || '?')}
    <span class="st ${esc(a.status)}">${esc(a.status.toUpperCase())}</span>
    <div class="muted">${esc(a.drafter)} · ${esc(a.author)}${a.promoted_ontology_version ? ' · ontology v' + esc(a.promoted_ontology_version) : ''}</div>
    ${errors}<h4>${esc(rt('diff'))}</h4><table>${diff}</table><h4>${esc(rt('impact'))}</h4>${impact}${approvals}${controls}</div>`;
}

async function draft(signalId, drafter) {
  try { await post('/api/amendments', {signal_id: signalId, drafter}); } catch (e) { alert(e.message); }
  loadReflect();
}
async function unsafeAmendment() {
  const full = await jsonFetch('/api/ontology/rules/R-AML-01');
  full.params = {...full.params, threshold: 0.95};
  try { await post('/api/amendments', {rule: full, author: 'unsafe-demo'}); } catch (e) { alert(e.message); }
  loadReflect();
}
async function reviewAmendment(id, approved) {
  const approver = $('#ap-' + id).value.trim(), role = $('#role-' + id).value;
  try { await post(`/api/amendments/${id}/review`, {approver, role, approved, reason: approved ? '' : 'rejected in review'}); }
  catch (e) { alert(e.message); }
  loadReflect();
}
async function resetOntology() { await post('/api/ontology/reset'); loadReflect(); }

$('#tabAgent').addEventListener('click', () => showTab('agent'));
$('#tabReflect').addEventListener('click', () => showTab('reflect'));
$('#lang').addEventListener('change', () => { if (!$('#reflect').hidden) loadReflect(); });
</script></body></html>
