<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>KYC Exception Agent</title>
<style>body{margin:0;background:#f4f2ea;color:#12211a;font-family:system-ui,sans-serif}header{padding:30px 5vw;background:#173c2f;color:#fff}main{max-width:1400px;margin:auto;padding:28px 5vw}.control{display:grid;grid-template-columns:1fr auto auto auto;gap:14px;margin-bottom:24px}select,input,button{font:inherit;border:1px solid #d9ddd5;border-radius:8px;padding:13px 16px;background:#fffef9}button{cursor:pointer;background:#c8ff62;font-weight:750}.grid{display:grid;grid-template-columns:1.35fr .65fr;gap:22px}.card{background:#fffef9;border:1px solid #d9ddd5;border-radius:12px;padding:22px}.empty{text-align:center;padding:80px 30px;color:#617069}.badges,.ontology,.workflow-graph{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0 20px}.badge,.node,.workflow-node{font-size:12px;padding:6px 9px;border-radius:6px;background:#edf2ed;border:1px solid #d9ddd5}.workflow-node.complete{color:#165f46}.workflow-node.active{color:#fff;background:#165f46}.muted{color:#617069;font-size:13px}.approval,.override,.rationale{margin:14px 0;padding:16px;border-radius:9px;background:#eff7e5;border:1px solid #c8df9f}.override{background:#fff0ed;border-color:#f0b8ad}.approval button,.approval input{display:block;width:100%;margin-top:10px}@media(max-width:850px){.grid,.control{grid-template-columns:1fr}}</style></head>
<body><header><h1 id="hTitle">KYC Exception<br>Resolution Agent</h1><p id="hSubtitle">Ontology-grounded reasoning, policy evidence, bounded tools, and human-controlled actions.</p></header><main><div class="control"><select id="case"></select><select id="planner"><option value="normal">Planner: normal (OpenRouter)</option><option value="compromised_demo">Planner: compromised demo</option></select><select id="lang"><option value="en">English</option><option value="vi">Tiếng Việt</option></select><button id="run">Run agent</button></div><div id="content" class="empty card">Select a synthetic case and run the agent.</div></main>
<!-- Compatibility source contracts: ${caseLabel} ${esc(d.case_id)} /api/reject Action rejected workflow-node active $('#case').addEventListener('change', clearDecision); if (version !== viewVersion) return; -->
<script>
const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));
const NODES=['intake','load_customer','verify_documents','screen_watchlists','load_risk','evidence_gate','retrieve_policy','policy_precheck','openrouter_reason','reconcile_guard','action_review','execute_action','await_documents','validate_submission','increment_cycle','safe_failure','operational_review','finalize','finalize_blocked','finalize_rejected'];let lastDecision=null,viewVersion=0;
async function jsonFetch(url,options){const r=await fetch(url,options),body=await r.json();if(!r.ok)throw Error(body.error||`Request failed (${r.status})`);return body}function errorCard(msg){$('#content').className='card';$('#content').innerHTML=`<div class="override"><b>Request failed</b><br>${esc(msg)}</div>`}function clearDecision(){viewVersion++;lastDecision=null;$('#content').className='empty card'}
function taskControls(d){const t=d.pending_task,p=t?.payload||{};if(!t)return '';if(t.kind==='action_approval')return `<div class="approval"><b>Human approval required</b><div class="muted">${esc(p.action_payload?.action||d.approval?.action)} · ${esc(t.interrupt_key)}</div><button onclick="approve('${esc(t.interrupt_key)}')">Approve bounded action</button><input id="reject-reason" placeholder="Rejection reason (required)"><button onclick="reject('${esc(t.interrupt_key)}')">Reject action</button></div>`;if(t.kind==='document_submission')return `<div class="approval"><b>Document submission required</b><div class="muted">Requested documents: ${esc((p.requested_documents||[]).join(', '))}</div><button onclick="submitEvidence('${esc(t.interrupt_key)}',${esc(JSON.stringify(p.requested_documents||[]))})">Submit verified evidence</button></div>`;return `<div class="approval"><b>Operational review required</b><div class="muted">Reason: ${esc(p.operational_reason||d.summary)}</div><button onclick="acknowledge('${esc(t.interrupt_key)}')">Acknowledge manual handoff</button></div>`}
function render(d){lastDecision=d;const trace=d.trace||[],active=new Set(trace.map(e=>e.step));if(d.current_node)active.add(d.current_node);const graph=NODES.map(n=>`<span class="workflow-node ${n===d.current_node?'active':active.has(n)?'complete':''}">${esc(n)}</span>`).join(''),conf=Number.isFinite(Number(d.proposal_confidence))?Math.round(Number(d.proposal_confidence)*100)+'%':'unavailable',warning=$('#planner').value==='compromised_demo'?'<div class="override"><b>Compromised demo mode</b><br>Deterministic policy remains authoritative.</div>':'';$('#content').className='grid';$('#content').innerHTML=`<section class="card"><div><b>${esc(d.outcome_label)}</b></div>${warning}<p>${esc(d.summary)}</p><div class="rationale">${esc(d.llm_rationale||'OpenRouter unavailable')}<div class="muted">planner confidence: ${conf}</div></div><h3>Workflow graph</h3><div class="workflow-graph">${graph}</div>${taskControls(d)}${d.executed_action?`<div class="approval">Action executed: ${esc(d.executed_action.ticket_id)}</div>`:''}</section><aside class="card"><h2>Agent trace</h2><div class="badges"><span class="badge">cycle ${esc(d.cycle_count||1)}/${esc(d.max_cycles||1)}</span><span class="badge">attempts ${esc(d.planner_attempts||0)}</span><span class="badge">${esc(d.planner_usage?.total_tokens||0)} tokens</span><span class="badge">cost ${esc(d.planner_usage?.cost??'n/a')}</span></div><ol>${trace.map(e=>`<li><b>${esc(e.title)}</b> <span class="muted">${esc(e.detail)} · attempt ${esc(e.attempt||1)}</span></li>`).join('')}</ol><h3>Branch trace</h3><div class="muted">${trace.map(e=>esc(e.route||e.step)).join(' → ')}</div></aside>`}
async function resumeTask(interruptKey,response){const version=++viewVersion,caseId=lastDecision?.case_id,lang=$('#lang').value;try{const d=await jsonFetch('/api/resume',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({interrupt_key:interruptKey,response,lang})});if(version===viewVersion&&caseId===$('#case').value&&lang===$('#lang').value)render(d)}catch(e){if(version===viewVersion)errorCard(e.message)}}function approve(k){resumeTask(k,{approved:true})}function reject(k){const reason=$('#reject-reason').value.trim();if(reason)resumeTask(k,{approved:false,reason})}function submitEvidence(k,docs){resumeTask(k,{documents:docs.map(type=>({type,status:'verified'}))})}function acknowledge(k){resumeTask(k,{acknowledged:true})}
async function run(){const version=++viewVersion,caseId=$('#case').value,lang=$('#lang').value;try{const d=await jsonFetch('/api/run',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({case_id:caseId,planner_mode:$('#planner').value,lang})});if(version===viewVersion)render(d)}catch(e){errorCard(e.message)}}async function init(){try{const cs=await jsonFetch('/api/cases');$('#case').innerHTML=cs.map(c=>`<option value="${esc(c.case_id)}">${esc(c.case_id)} — ${esc(c.title)}</option>`).join('')}catch(e){errorCard(e.message)}}async function onLangChange(){if(!lastDecision)return;try{render(await jsonFetch('/api/relocalize',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({decision_id:lastDecision.decision_id,lang:$('#lang').value})}))}catch(e){errorCard(e.message)}}$('#run').addEventListener('click',run);$('#case').addEventListener('change',clearDecision);$('#lang').addEventListener('change',onLangChange);init();
</script></body></html>
